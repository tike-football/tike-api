name: deploy_st

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tike-api
  ECS_CLUSTER: tike-api-staging
  ECS_SERVICE: tike-api-staging-service
  ECS_TASK_FAMILY: tike-api-staging
  CONTAINER_NAME: tike-api
  ST_ENV_FILE: appconfig/ST.env

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test app keys
        run: |
          cp .env.testing .env
          php artisan key:generate --force
          php artisan passport:keys --force

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml

  deploy_st:
    if: github.ref == 'refs/heads/staging'
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::139194331469:role/GitHubActionsTikeApiStagingDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: staging-${{ github.sha }}
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          docker buildx create --use --name tike-builder || docker buildx use tike-builder
          docker buildx build \
            --platform linux/amd64 \
            -f docker/production/Dockerfile \
            --build-arg APP_ENV=staging \
            -t ${IMAGE_URI} \
            --push \
            .

      - name: Render new task definition
        run: |
          PASSPORT_SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id tike-staging/passport \
            --query 'ARN' \
            --output text)
          echo "PASSPORT_SECRET_ARN=${PASSPORT_SECRET_ARN}" >> $GITHUB_ENV

          aws ecs describe-task-definition \
            --task-definition ${ECS_TASK_FAMILY} \
            --query taskDefinition > task-definition.json

          awk -F= '
            /^[[:space:]]*#/ {next}
            /^[[:space:]]*$/ {next}
            {
              key=$1
              sub(/^[[:space:]]+/, "", key)
              sub(/[[:space:]]+$/, "", key)
              if (key == "") next

              val=substr($0, index($0, "=")+1)
              sub(/^[[:space:]]+/, "", val)
              sub(/[[:space:]]+$/, "", val)
              gsub(/^"/, "", val)
              gsub(/"$/, "", val)

              if (val == "__FROM_SECRET_MANAGER__") next
              gsub(/"/, "\\\"", val)
              printf "\"%s\":\"%s\",\n", key, val
            }
          ' "${ST_ENV_FILE}" | sed '$ s/,$//' | awk 'BEGIN{print "{"} {print} END{print "}"}' > st-env.json

          jq --slurpfile st st-env.json 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
              | ($st[0]) as $stenv
              | .containerDefinitions |= map(
                  if .name == env.CONTAINER_NAME then
                    .image = env.IMAGE_URI
                    | .environment = (
                        ((.environment // []) | map({(.name): .value}) | add // {}) as $old
                        | ($old + $stenv | to_entries | map({name: .key, value: .value}))
                      )
                    | .secrets = (
                        ((.secrets // []) | map(select(.name != "PASSPORT_PRIVATE_KEY" and .name != "PASSPORT_PUBLIC_KEY")))
                        + [
                            {
                              "name": "PASSPORT_PRIVATE_KEY",
                              "valueFrom": (env.PASSPORT_SECRET_ARN + ":PASSPORT_PRIVATE_KEY::")
                            },
                            {
                              "name": "PASSPORT_PUBLIC_KEY",
                              "valueFrom": (env.PASSPORT_SECRET_ARN + ":PASSPORT_PUBLIC_KEY::")
                            }
                          ]
                      )
                  else .
                  end
                )' \
              task-definition.json > task-definition-rendered.json

      - name: Register task definition revision
        id: taskdef
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "TASK_DEF_ARN=${TASK_DEF_ARN}" >> $GITHUB_ENV

      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --task-definition ${TASK_DEF_ARN} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster ${ECS_CLUSTER} \
            --services ${ECS_SERVICE}

      - name: Verify queue worker command includes emails queue
        run: |
          aws ecs describe-task-definition \
            --task-definition ${TASK_DEF_ARN} \
            --query 'taskDefinition.containerDefinitions[0].command' \
            --output text || true
